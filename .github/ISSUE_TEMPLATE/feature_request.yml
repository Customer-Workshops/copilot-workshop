name: 💡 Feature Request
description: Propose an enhancement, new tool, or structural change.
labels:
  - enhancement
body:
  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe it.
      placeholder: I'm always frustrated when... / There is currently no way to...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of the functionality you would like to see added.
      placeholder: I would like to be able to...
    validations:
      required: true

  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions, workarounds, or features you have considered.
      placeholder: I have tried... / An alternative approach could be...
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, visual mockups, examples, or references that support the request.
      placeholder: Attach mockups, link to similar features in other tools, or paste relevant examples here...
    validations:
      required: false
